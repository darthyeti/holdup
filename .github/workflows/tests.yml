# Automatische Tests auf GitHubs Rechnern (öffentliches Repo: kostenlos).
# - Bei jedem Pull Request und jedem Push auf main: schneller Lauf (ohne slow: true) in drei Teilen (schnell-teil), dazu der Sammel-Job "schnell" (gruen nur, wenn alle Teile gruen sind): er ist der Pflicht-Check der Branch Protection.
# - Nachts und von Hand (Actions > Tests > Run workflow) oder mit dem Label "voller-lauf" am PR: voller Lauf, in drei Teil-Jobs (run.js --shard=i/3, Dateien nach Gewicht verteilt), damit er unter dem 60-Minuten-Limit bleibt.
name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'nacht' || 'lauf' }}
  cancel-in-progress: true

jobs:
  schnell-teil:
    name: schnell (Teil ${{ matrix.teil }} von 3)
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3]
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Abhängigkeiten und Chromium
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium || { echo "::warning::Systempakete nicht installierbar (Paketquelle?), Chromium ohne --with-deps"; npx playwright-core install chromium; }
          echo "HOLDUP_CHROME=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Schneller Lauf
        working-directory: tests
        run: node run.js --fast --jobs=auto --shard=${{ matrix.teil }}/3

  # Sammel-Job: heisst wie der alte Einzel-Job und bleibt der Pflicht-Check der Branch Protection. Gruen nur, wenn alle drei Teile gruen sind (auch ein uebersprungener oder abgebrochener Teil macht ihn rot).
  schnell:
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    needs: schnell-teil
    runs-on: ubuntu-latest
    steps:
      - name: Alle Teile gruen?
        run: |
          echo "Ergebnis der Teile: ${{ needs.schnell-teil.result }}"
          [ "${{ needs.schnell-teil.result }}" = "success" ]

  voll:
    name: voll (Teil ${{ matrix.teil }} von 3)
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'voller-lauf'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Abhängigkeiten und Chromium
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium || { echo "::warning::Systempakete nicht installierbar (Paketquelle?), Chromium ohne --with-deps"; npx playwright-core install chromium; }
          echo "HOLDUP_CHROME=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Voller Lauf
        working-directory: tests
        run: node run.js --jobs=auto --shard=${{ matrix.teil }}/3
