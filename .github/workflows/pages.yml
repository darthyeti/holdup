# Veröffentlichung auf GitHub Pages: main im Wurzelordner, dazu je offenem PR mit Label "spielgefuehl" eine Vorschau
# unter /pr/<n>/ (tools/pages-site.sh). Die Build-Nummer (Anzahl der Commits) und das Datum setzt tools/stamp-build.sh
# nur in der veröffentlichten Kopie. Im Repo bleibt die Build-Zeile unverändert, deshalb gibt es zwischen parallelen
# Branches dort keine Konflikte.
# PR-Ereignisse laufen über pull_request_target: Der Workflow kommt aus main und checkt main aus, der Code der PRs wird
# nur als Dateien kopiert, nie ausgeführt. So darf er in die Umgebung github-pages (nur main) veröffentlichen.
# Einmalig nötig: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # PR-Ereignisse nur, wenn das Label spielgefuehl beteiligt ist (gesetzt, entfernt oder am PR).
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.label.name == 'spielgefuehl' ||
      contains(github.event.pull_request.labels.*.name, 'spielgefuehl')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Offene PRs mit spielgefuehl holen
        id: prs
        run: |
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label spielgefuehl --json number,headRepositoryOwner \
            --jq ".[] | select(.headRepositoryOwner.login == \"${GITHUB_REPOSITORY_OWNER}\") | .number" | tr '\n' ' ')
          for n in $prs; do git fetch --no-tags origin "pull/$n/head:refs/remotes/origin/pr/$n"; done
          echo "list=$prs" >> "$GITHUB_OUTPUT"
          echo "Vorschauen: ${prs:-keine}"
      - name: Seite zusammenstellen und Build-Nummern setzen
        run: sh tools/pages-site.sh _site ${{ steps.prs.outputs.list }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Link zur Vorschau in den PR schreiben
        if: github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'spielgefuehl'
        run: |
          n=${{ github.event.pull_request.number }}
          url="${{ steps.deploy.outputs.page_url }}pr/$n/#debug"
          gh pr comment "$n" --repo "$GITHUB_REPOSITORY" --body "Vorschau zum Spielen: $url (mit Testwerkzeugen, Optionen im Titel: Aufträge frei; nach jedem Push neu, Strg+Umschalt+R lädt frisch). Freigabe durch Till hier im PR oder im Chat.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
