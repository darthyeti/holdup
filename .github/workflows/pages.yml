# Veröffentlichung auf GitHub Pages bei jedem Push auf main.
# Die Build-Nummer (Anzahl der Commits auf main) und das Datum setzt tools/stamp-build.sh nur in der veröffentlichten
# Kopie. Im Repo bleibt die Build-Zeile unverändert, deshalb gibt es zwischen parallelen Branches dort keine Konflikte.
# Einmalig nötig: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Seite zusammenstellen und Build-Nummer setzen
        run: |
          mkdir -p _site
          cp -r index.html assets js _site/
          sh tools/stamp-build.sh _site "$(git rev-list --count HEAD)" "$(TZ=Europe/Berlin date +%F)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
