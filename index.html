function ev(n){if(!ac)return;const t=T0();
if(n==='vault'){tn(t,.55,{f:70,f2:34,g:.85});nz(t,.4,{t:'lowpass',f:500,g:.5});tn(t+.1,.4,{f:240,f2:200,w:'square',g:.09})}

const isSolF=(x,y)=>isSol(x,y)&&cell(x,y)!=='X';
function flow(){dist=Array.from({length:H},()=>Array(W).fill(999));const q=[];for(const o of actv()){const sx=clamp(Math.floor(o.x/T),WX0,WX0+W-1),sy=clamp(Math.floor(o.y/T),WY0,WY0+H-1);if(dist[sy-WY0][sx-WX0]>0){dist[sy-WY0][sx-WX0]=0;q.push([sx,sy])}}let h=0;while(h<q.length){const c=q[h++];const cd=dist[c[1]-WY0][c[0]-WX0];for(const v of D4){const nx=c[0]+v[0],ny=c[1]+v[1];if(isSolF(nx,ny))continue;const w2=cell(nx,ny)==='X'?CFG.bar.pen:1;if(dist[ny-WY0][nx-WX0]<=cd+w2)continue;dist[ny-WY0][nx-WX0]=cd+w2;q.push([nx,ny])}}}
function flowDir(e){const ex=clamp(Math.floor(e.x/T),WX0,WX0+W-1),ey=clamp(Math.floor(e.y/T),WY0,WY0+H-1);const dd=(x,y)=>dist[y-WY0][x-WX0];let best=dd(ex,ey),bx=ex,by=ey;for(const v of D8){const nx=ex+v[0],ny=ey+v[1];if(isSolF(nx,ny))continue;if(v[0]&&v[1]&&(isSolF(ex+v[0],ey)||isSolF(ex,ey+v[1])))continue;if(dd(nx,ny)<best){best=dd(nx,ny);bx=nx;by=ny}}
let cx=bx*T+16-e.x,cy=by*T+16-e.y;if(bx===ex&&by===ey){const np=nearestPl(e);cx=np.x-e.x;cy=np.y-e.y}const l=Math.hypot(cx,cy)||1;return[cx/l,cy/l]}

function barNudge(b){const iv=b.iv;for(const o of players){if(!live(o)||!barHit(b,o))continue;const s=(o.x-b.x)*iv[0]+(o.y-b.y)*iv[1],k=s>=0?1:-1,lx=iv[0]?o.x:o.x,ly=o.y;

function barItem(b){return{t:'bar',b,x:b.x,y:b.y,r:b.r||58,pr:0,sn:'pry',
mode(o){if((phase!==2&&!b.rd)||ended||b.st==='fuse')return 0;if(b.rd&&tk&&(tk.st==='stopped'||tk.st==='gone'))return 0;const need=b.mc||1;if(b.lv<CFG.bar.lv&&(o.mat|0)>=need){if(!b.lv&&b.cells.some(c=>{const t=cell(c[0],c[1]);return b.okc.indexOf(t)<0&&!(t==='V'&&vaultOpen)}))return 0;return barFree(b)?1:3}return b.lv>0?2:0},
ok(o){return this.mode(o)>0},
lab(o){const m=this.mode(o),nd=b.mc||1;return m===1?(b.rd?(b.lv?'Sperre verstärken: ':'Straße sperren: '):(b.lv?'Barrikade verstärken: ':'Tür verbarrikadieren: '))+b.n+' ('+nd+' Material)':m===3?(b.rd?'Hier steht etwas im Weg':'Türrahmen ist besetzt'):'Barrikade abbauen: '+b.n},
dur(o){const m=this.mode(o);return m===1?CFG.bar.buildT[b.lv]*(b.bt||1):m===3?1e9:CFG.bar.dismT},
act(o){const m=this.mode(o),nd=b.mc||1;if(m===1){barNudge(b);o.mat-=nd;o.units=Math.max(0,o.units-CFG.bar.matU*nd);if(!b.lv){b.pv=b.cells.map(c=>cell(c[0],c[1]));b.cells.forEach(c=>setc(c[0],c[1],'X'));b.cd=CFG.bar.hold}else b.cd+=CFG.bar.hold*.5;
b.lv++;b.hp=b.lv*CFG.bar.hp;flowT=0;snd('thud',b.x,b.y);say(b.n+(b.rd?' steht (Stufe ':' verbarrikadiert (Stufe ')+b.lv+')',undefined)}
else if(m===2){let back=0;for(let i=0;i<b.lv*nd;i++)if(o.units+CFG.bar.matU<=o.bag+.01&&(o.mat|0)<CFG.bar.matMax){o.mat=(o.mat|0)+1;o.units+=CFG.bar.matU;back++}
b.cells.forEach((c,i)=>setc(c[0],c[1],b.pv[i]));b.lv=0;b.hp=0;b.tk=false;flowT=0;snd('thud',b.x,b.y);say(b.n+' freigeräumt'+(back?' (+'+back+' Material)':''))}}}}

function tkStep(dt){const t=tk;if(!t)return;

if(t.st!=='drive')return;
const C=CFG.truck,front=t.x+TKL/2;let stopC=1e9,why=0;
for(const b of bars)if(b.rd&&b.lv>0){const xb=b.cells[0][0]*T;if(xb>front-10){const c=xb-C.gap-TKL/2;if(c<stopC){stopC=c;why=1}}}
for(const o of actv())if(Math.abs(o.y-t.y)<TKH/2+16&&o.x>front-6&&o.x<front+130){const c=o.x-100-TKL/2;if(c<stopC){stopC=c;why=2}}

function tkStamp(){const t=tk,x0=Math.floor((t.x-TKL/2+4)/T),x1=Math.floor((t.x+TKL/2-4)/T),y0=Math.floor((t.y-TKH/2+2)/T),y1=Math.floor((t.y+TKH/2-2)/T);t.cells=[];

function tkStopped(why){const t=tk,y0=tkStamp();const out=y0*T-14;for(const o of players.concat(en,npcs))if(Math.abs(o.x-t.x)<TKL/2+8&&Math.abs(o.y-t.y)<TKH/2+10)o.y=out;

const e=mkCop(x,y,false),a=y<t.y?-1.57:1.57;Object.assign(e,{kind:'grd',row:2,hp:C.crew.hp,mhp:C.crew.hp,cool:1+i*.25,dmg:C.crew.dmg,rate:C.crew.rate,acc:C.crew.acc,spd:C.crew.spd,muz:16,mode:'post',post:{x:0,y:0,a},rt:tH+C.crewHold+i*2,crew:true,drv:i===0,a});en.push(e)}}

function finish(win,title,extra,soft){if(ended)return;let score=secured;const lines=[];lines.push('Beute: '+fmt(secured));
