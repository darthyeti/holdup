main{max-width:1100px;margin:0 auto;display:grid;gap:14px}
/* Bildgroesse (VIEW im Skript): Voreinstellung "auto" fuellt das Fenster im Seitenverhaeltnis 960:544, "fix" (html[data-view=fix]) haelt das Bild bei hoechstens 1100 px.
   --chrome ist die Hoehe von Rand und Kopfzeile ueber und unter dem Bild. Vollbild (html[data-fs]) blendet die Kopfzeile aus und passt das Bild an den Bildschirm an. */
html:not([data-view=fix]) main{max-width:none;width:min(100%,max(480px,calc((var(--vh) - var(--chrome))*960/544)))}
html[data-fs]{background:var(--bg)}
html[data-fs] body{margin:0;padding:0;min-height:var(--vh);display:grid;place-items:center}
html[data-fs] header{display:none}
html[data-fs] main{max-width:none;width:min(100vw,calc(var(--vh)*960/544))}
html[data-fs] canvas{border:0;border-radius:0}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
header p{margin:0;color:var(--muted)}
.ver{margin-left:auto;font-size:12px}
canvas{display:block;width:100%;aspect-ratio:960/544;border-radius:10px;background:#0e1014;outline:none;cursor:crosshair;border:1px solid var(--line)}
canvas:focus-visible{border-color:var(--accent)}
#err{color:#ff8a7a;margin:0}
</style>

function mkSniper(po){const S=CFG.snp;return{id:++eid,kind:'sniper',row:8,x:po.x,y:po.y,r:9,hp:S.hp,mhp:S.hp,h:0,a:po.a,w:0,cool:0,react:0,dir:1,dt:1,mvg:false,fl:0,dmg:S.dmg,rate:1,acc:0,spd:0,muz:30,mode:'snipe',post:po,path:[],rt:0,bt:0,sh:0,sx:0,aim:0,cd:S.first,tg:-1,lx:po.x,ly:po.y}}
function spawnSnipers(){const S=CFG.snp,P=LAY.snp||[];if(waveN<hFrom(S.from,'snp')||!P.length)return;const alive=en.filter(e=>e.kind==='sniper'&&e.hp>0),pend=[...pcs,...fps].flatMap(c=>c.crew.filter(q=>q&&q.sn).map(q=>q.sn));if(alive.length+pend.length>=S.max)return;

for(const po of free){let sc=Math.random();for(const o of actv())if(Math.hypot(o.x-po.x,o.y-po.y)<S.range&&clearSn(po.x,po.y,o.x,o.y))sc+=2;if(sc>bs){bs=sc;best=po}}

say('Scharfschütze rückt an, Posten im '+{S:'Süden',N:'Norden',W:'Westen',E:'Osten'}[best.side]+': Fenster sichern oder aus der Sichtlinie!');ban('Scharfschütze!',1.8);snd('alert')}
/* Scharfschuetze steigt am Wagen aus und geht den Weg zu seinem Posten (walk), erst dort zielt er (snipeStep) */
function snipeOut(po,x,y){const e=mkSniper(po),pa=pathTo(x,y,Math.floor(po.x/T),Math.floor(po.y/T));e.x=x;e.y=y;if(pa.length){e.walk=pa;e.a=LANE.face;e.wt=0}else{e.x=po.x;e.y=po.y}en.push(e)}
function snipeWalk(e,dt){e.wt+=dt;const q=e.walk[0],arrive=()=>{e.walk=null;e.mvg=false;e.x=e.post.x;e.y=e.post.y;e.a=e.post.a};if(!q||e.wt>45){arrive();return}const dx=q[0]-e.x,dy=q[1]-e.y,dd=Math.hypot(dx,dy);if(dd<4){e.walk.shift();if(!e.walk.length)arrive();return}

/* Granaten: Nach dem Knall einer Barrikade wirft die Polizei erst eine Blend-, dann eine Gasgranate durch die Luecke (stormGren, Warteschlange gq). Granate gr: fliegt (st fly), liegt (rest, Zuendzeit tm), platzt (flashBang, gasCloud). Blendung o.bl (s), Gas o.gs (0..1), Wolke gc. Gas allein toetet nicht (bleibt bei 1 HP). */
function stormGren(b){const G=CFG.gren;if(waveN<hFrom(G.from,'gren'))return;gq.push({at:G.flash.delay,k:'flash',b});if(waveN>=hFrom(G.gasFrom,'gas'))gq.push({at:G.gas.delay,k:'gas',b})}
function throwGren(e,k,tx,ty){const G=CFG.gren;let dx=tx-e.x,dy=ty-e.y;const d=Math.hypot(dx,dy)||1,dd=Math.min(d,G.maxD);dx/=d;dy/=d;gr.push({id:++bid,k,x:e.x,y:e.y,vx:dx*G.spd,vy:dy*G.spd,st:'fly',t:dd/G.spd,tm:0});e.a=Math.atan2(dy,dx);snd('gthrow',e.x,e.y);say(k==='flash'?'Blendgranate!':'Gasgranate!')}
function grQueue(j){const b=j.b,G=CFG.gren;let e=null,bd=G.reach;for(const q of en){if(q.kind==='grd'||q.kind==='sniper'||q.hp<=0||q.sur)continue;const d=Math.hypot(q.x-b.x,q.y-b.y);if(d<bd){bd=d;e=q}}if(!e)return;
let t=null,td=G.range;for(const o of actv()){const d=Math.hypot(o.x-b.x,o.y-b.y);if(d<td){td=d;t=o}}
const tx=t?t.x+(Math.random()-.5)*30:b.x+b.iv[0]*T*3,ty=t?t.y+(Math.random()-.5)*30:b.y+b.iv[1]*T*3;throwGren(e,j.k,tx,ty)}
function flashBang(x,y){const F=CFG.gren.flash;evt('gb',[x,y,0]);
for(const o of actv()){const d=Math.hypot(o.x-x,o.y-y);if(d>F.r||!los(x,y,o.x,o.y))continue;const face=angd(o.a,Math.atan2(y-o.y,x-o.x))<1.35?1:F.face,t=Math.max(F.minT,F.t*(1-d/F.r)*face);o.bl=Math.max(o.bl||0,t);sndTo(o,'ring',t)}}
function gasCloud(x,y){const G=CFG.gren.gas;evt('gb',[x,y,1]);gc.push({id:++bid,x,y,r:G.r,t:G.t})}
function grStep(dt){const G=CFG.gren;
gq=gq.filter(j=>{j.at-=dt;if(j.at>0)return true;grQueue(j);return false});
for(const q of gr){if(q.st==='fly'){const n=Math.max(1,Math.ceil(Math.hypot(q.vx,q.vy)*dt/4));for(let i=0;i<n;i++){const nx=q.x+q.vx*dt/n,ny=q.y+q.vy*dt/n;if(isSol(Math.floor(nx/T),Math.floor(ny/T))){q.t=0;break}q.x=nx;q.y=ny}q.t-=dt;if(q.t<=0){q.st='rest';q.vx=q.vy=0;q.tm=q.k==='flash'?G.flash.fuse:q.k==='gas'?G.gas.fuse:CFG.gadget.fuse}}
else{q.tm-=dt;if(q.tm<=0){q.dead=1;if(q.k==='flash')flashBang(q.x,q.y);else if(q.k==='gas')gasCloud(q.x,q.y);else if(q.k==='smoke')smokeCloud(q.x,q.y);else decoyOn(q.x,q.y)}}}
gr=gr.filter(q=>!q.dead);

for(const c of gc){c.t-=dt;for(const o of actv()){const d=Math.hypot(o.x-c.x,o.y-c.y);if(d>=c.r||!los(c.x,c.y,o.x,o.y))continue;o.gs=Math.min(1,o.gs+dt*2.8);o.hp=Math.max(1,o.hp-G.gas.dps*dt*(o.mask?G.gas.maskF:1));if(!o.mask&&(o.cg-=dt)<=0){o.cg=G.gas.tick;sndTo(o,'cough')}}}
gc=gc.filter(c=>c.t>0)}
const lsp=o=>(o.bl>0?CFG.gren.flash.spread:0)+(o.gs>.2&&!o.mask?CFG.gren.gas.spread:0);
/* Auftrags-Ereignisse (LAY.mission.ev): Wachwechsel und Geldtransport (vorab angelegte, abwesende Wachen), Stromausfall, Streife (Polizei frueher), Feiertag (mehr Zivilisten) */

function startHeist(forced,by,why){if(phase!==1||ended)return;phase=2;alarmT=0;alarmBy=null;if(by&&by.st)by.st.alarm=forced?2:1;const who=by&&players.length>1?pn(by.id):null;LAY.spots.forEach(sp=>{if(sp.ex)sp.cells.forEach(c=>{if(cell(c[0],c[1])==='L')setc(c[0],c[1],'l')})});flowT=0;players.forEach(o=>{o.armed=true});tH=0;waveT=0;snd('alarm',forced);ban(LAY.truck?'ÜBERFALL AUF DEN PANZERWAGEN!':(who?who+': ':'')+(forced?'ENTDECKT! ALARM!':'ÜBERFALL! ALLE AUF DEN BODEN!'),2.8);if(who&&why!==false&&!LAY.truck)say(who+' '+(why||(forced?'ist aufgefallen: Alarm!':'hat die Waffe gezogen: Überfall!')));if(!LAY.truck)say('Möbel zerlegen (E) gibt Material für Barrikaden an den Türen.');

/* Wurfgeraete der Spieler (CFG.gadget): Rauchgranate (Taste 4), Ablenker (5), Taste 3 ist frei (die Blendgranate des Shops ist seit MRU 1 A1 gestrichen, die der Polizei bleibt). Taste halten zeigt den Zielring an der Maus, Loslassen schickt das Ziel (reqThrow), der Host prueft Vorrat, Phase und Weite und wirft ueber die Liste gr (Arten flash, smoke, dec, dazu gas der Polizei).
